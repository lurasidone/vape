target = "horizon_client::game::remote::Game<'_>::send"
kind = "HEAD"
cancellable = true
priority = 90
helper = "src/adapters/block_hit_send.rs"
bindings = [
 { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
 { name = "packet", ty = "&horizon_protocol::packets::play::Serverbound", value = "&packet" },
]

# AutoTotem's silent open holds the attack, use and block-break clicks
# (onClickMouse, onRightClickMouse, onSendClickBlock) on the remote paths.
[[native.mixin]]
id = "auto-totem-attack"
target = "horizon_client::game::remote::interaction_actions::Game::remote_start_attack"
kind = "HEAD"
cancellable = true
helper = "src/adapters/auto_totem_attack.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "auto-totem-use"
target = "horizon_client::game::remote::interaction_actions::Game::remote_use"
kind = "HEAD"
cancellable = true
helper = "src/adapters/auto_totem_use.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "auto-totem-break"
target = "horizon_client::game::remote::interaction_actions::Game::remote_continue_attack"
