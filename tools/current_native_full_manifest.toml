id = "vape_rs"
name = "vape-rs"
version = "0.1.0-dev"
description = "Local Rust recreation of the Vape client for Horizon"
authors = []
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"


[[native.mixin]]
id = "client-tick"
target = "horizon_client::game::Game<'_>::tick"
kind = "HEAD"
helper = "src/adapters/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "control-key-names"
target = "horizon_client::game::control::key_code"
kind = "HEAD"
cancellable = true
helper = "src/adapters/current_control_keys.rs"
bindings = [{ name = "name", ty = "&str", value = "name" }]

# Fly/Speed/LongJump: the module's move replaces this tick's vanilla travel.
# The head records the pre-travel position and fall; the body puts them back
# and applies the module's collision-checked move after the local tick.
[[native.mixin]]
id = "fly-move-head"
target = "horizon_client::game::remote::tick::Game::tick_local_player_body"
kind = "HEAD"
cancellable = false
helper = "src/adapters/fly_move_head.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "fly-move-body"
target = "horizon_client::game::remote::tick::Game::tick_local_player_body"
kind = "AFTER_CALL"
selector = "self.seat_own_stands"
require = 1
ordinal = 0
result = "()"
helper = "src/adapters/fly_move_body.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "entity_collisions", ty = "&[horizon_core::geometry::Aabb]", value = "&entity_collisions" },
]

[[native.mixin]]
id = "client-hud"
target = "horizon_client::game::extras::Game<'_>::draw_extras"
kind = "HEAD"
helper = "src/adapters/current_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]



